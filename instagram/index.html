.headline p{max-width:590px;margin:16px auto 0;color:var(--muted);font-size:16px;line-height:1.5}
.video-wrap{overflow:hidden;border:1px solid var(--line);border-radius:22px;background:#000;box-shadow:0 18px 45px rgba(0,0,0,.35)}
video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}
.actions{display:grid;gap:13px;margin-top:20px}.btn{display:flex;align-items:center;justify-content:center;min-height:62px;padding:15px 20px;border-radius:17px;text-decoration:none;font-size:17px;font-weight:900;letter-spacing:.4px;transition:transform .2s ease,filter .2s ease}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}.btn-whatsapp,.btn-site{background:var(--green);color:#fff;border:1px solid rgba(255,255,255,.08)}
.icon{margin-right:11px;font-size:24px;line-height:1}.footer{margin-top:28px;text-align:center;color:#899089;font-size:11px;letter-spacing:2.5px;text-transform:uppercase}
.footer:before{content:"";display:block;width:48px;height:3px;margin:0 auto 16px;border-radius:99px;background:var(--green)}
@media(max-width:480px){.page{padding:22px 14px 34px}.headline p{font-size:15px}.video-wrap{border-radius:17px}.btn{min-height:58px}}
